<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 900px; overflow: hidden; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, #312e81 0%, #4f46e5 45%, #7c3aed 78%, #581c87 100%);
    color: #fff;
    position: relative;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  .spark {
    position: absolute;
    width: 46px; height: 46px;
    background: #fff;
    clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
    opacity: 0.16;
  }
  .spark.s1 { left: 110px; top: 150px; }
  .spark.s2 { right: 130px; top: 120px; width: 30px; height: 30px; opacity: 0.22; }
  .spark.s3 { left: 220px; bottom: 120px; width: 26px; height: 26px; opacity: 0.2; }
  .spark.s4 { right: 260px; bottom: 170px; width: 52px; height: 52px; opacity: 0.12; }
  .spark.s5 { right: 420px; top: 260px; width: 18px; height: 18px; opacity: 0.28; }

  .wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    padding: 60px;
    text-align: center;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(255, 255, 255, 0.14);
    border: 1px solid rgba(255, 255, 255, 0.28);
    border-radius: 999px;
    padding: 10px 22px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 12px #4ade80; }
  h1 {
    font-size: 118px;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.05;
  }
  .tagline {
    font-size: 40px;
    font-weight: 500;
    color: #e0e7ff;
  }
  .features {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 14px;
    max-width: 1280px;
    margin-top: 14px;
  }
  .feature {
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 999px;
    padding: 12px 26px;
    font-size: 26px;
    font-weight: 600;
  }
  .foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 34px 60px;
    border-top: 1px solid rgba(255, 255, 255, 0.18);
    background: rgba(0, 0, 0, 0.15);
    font-size: 24px;
    font-weight: 600;
    color: #e0e7ff;
  }
  .lock {
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .lock svg { width: 26px; height: 26px; }
</style>
</head>
<body>
  <div class="spark s1"></div>
  <div class="spark s2"></div>
  <div class="spark s3"></div>
  <div class="spark s4"></div>
  <div class="spark s5"></div>

  <div class="wrap">
    <div class="badge"><span class="dot"></span> Версия 3.0</div>
    <h1>Очиститель текста</h1>
    <div class="tagline">Грязный текст — чистый за один клик</div>
    <div class="features">
      <span class="feature">Пробелы</span>
      <span class="feature">Переносы</span>
      <span class="feature">Кавычки</span>
      <span class="feature">Регистр</span>
      <span class="feature">HTML</span>
      <span class="feature">Markdown</span>
      <span class="feature">JSON · XML · SQL</span>
      <span class="feature">Личные данные</span>
      <span class="feature">Дифф</span>
      <span class="feature">Сценарии</span>
    </div>
  </div>

  <div class="foot">
    <span>Полностью локально · Ваш текст никуда не уходит</span>
    <span class="lock">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      Бесплатно · Без установки
    </span>
  </div>
</body>
</html>
